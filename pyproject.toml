[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "RepoMentor"
version = "0.1.0"
description = "Explains any GitHub repository like a senior engineer would on your first day."
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0",
]

[project.scripts]
RepoMentor = "repomentor.cli:main"